<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NarutoCV — Scene Dev Harness</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
    <style>
      #scene-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .scene-page {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .scene-viewport {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #scene-debug-hud {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        background: rgba(27, 31, 44, 0.85);
        border-radius: 8px;
        padding: 0.6rem 0.85rem;
        font-size: 0.8rem;
        pointer-events: none;
      }
      .scene-controls-hint {
        position: absolute;
        bottom: 0.75rem;
        left: 0.75rem;
        color: var(--text-dim);
        font-size: 0.8rem;
        background: rgba(27, 31, 44, 0.85);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        pointer-events: none;
      }
      #scene-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 17, 26, 0.6);
        color: var(--text, #f4f4f5);
        font-size: 1rem;
        pointer-events: none;
      }
      /* An ID selector setting `display` beats the UA stylesheet's
         `[hidden] { display: none }`, so `element.hidden = true` alone does
         nothing here without this explicit override. Same for the two HUDs. */
      #scene-loading[hidden],
      #scene-debug-hud[hidden],
      #game-hud[hidden] {
        display: none;
      }

      /* --- player-facing HUD --- */
      #game-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: inherit;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
      }
      .hud-row {
        position: absolute;
        display: flex;
        gap: 1.75rem;
        align-items: baseline;
      }
      .hud-primary {
        top: 1rem;
        right: 1.25rem;
      }
      .hud-secondary {
        bottom: 1rem;
        right: 1.25rem;
        align-items: center;
        gap: 1rem;
      }
      .hud-stat {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .hud-label {
        font-size: 0.7rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      .hud-value {
        font-size: 1.6rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-lives {
        font-size: 1.25rem;
        letter-spacing: 0.15em;
        color: #ff8a3d;
      }
      .hud-lives-critical {
        color: #ff4646;
      }
      .hud-input-status {
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
      }
      /* Red screen-edge vignette pulse on damage; opacity driven from JS. */
      .hud-flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 0, 0, 0) 45%,
          rgba(255, 30, 30, 0.55) 100%
        );
      }

      /* =====================================================
         Feature Brief 02 — combat HUD and Game Over panel.

         Palette is sampled from the live environment modules, per brief
         §4.3 ("do not invent a new palette"):
           #6b4423 fallen-log brown  (gameConfig OBSTACLE_TYPES.log.color)
           #4a3122 / #5b3a21 trunks  (environmentProps trunkMaterials)
           #3f5c2a grass             (jungleTrack GRASS_COLOR)
           #2f7d3a canopy green      (environmentProps canopyMaterials)
           #c9a227 leaf yellow       (OBSTACLE_TYPES.log.accent)
           #ff8a3d NarutoCV accent   (existing title/HUD orange)
         ===================================================== */

      /* --- combat HUD --- */
      #combat-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      #combat-hud[hidden] {
        display: none;
      }
      .combat-seals-wrap {
        position: absolute;
        left: 50%;
        bottom: 3.5rem;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        background: rgba(24, 18, 12, 0.72);
        border: 2px solid #6b4423;
        border-radius: 12px;
        padding: 0.7rem 1.1rem;
      }
      .combat-status {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.9;
      }
      .combat-status[data-tone="bad"] { color: #ff8080; }
      .combat-status[data-tone="good"] { color: #8fbf4d; }
      .combat-seals {
        display: flex;
        gap: 0.75rem;
      }
      .combat-seal {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 3.1rem;
        padding: 0.35rem 0.4rem;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.35);
        transition: transform 120ms ease, border-color 120ms ease;
      }
      .combat-seal-glyph { font-size: 1.5rem; line-height: 1.1; }
      .combat-seal-name {
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      .combat-seal.is-current {
        border-color: #ff8a3d;
        background: rgba(255, 138, 61, 0.22);
        transform: translateY(-3px) scale(1.06);
      }
      .combat-seal.is-done {
        border-color: #8fbf4d;
        background: rgba(143, 191, 77, 0.22);
        opacity: 0.85;
      }
      .combat-timer {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .combat-timer > span {
        display: block;
        height: 100%;
        background: #ff8a3d;
        transform-origin: left center;
        transform: scaleX(0);
      }
      .combat-banner {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #ffd9a0;
        text-shadow: 0 0 18px rgba(255, 138, 61, 0.55), 0 3px 8px rgba(0, 0, 0, 0.9);
      }
      .combat-banner[hidden] { display: none; }
      .combat-banner-in { animation: banner-in 1.6s ease-out forwards; }
      @keyframes banner-in {
        0%   { opacity: 0; transform: translateX(-50%) scale(0.85); }
        18%  { opacity: 1; transform: translateX(-50%) scale(1); }
        75%  { opacity: 1; }
        100% { opacity: 0; }
      }

      /* --- Game Over panel --- */
      #game-over {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 20;
      }
      #game-over[hidden] { display: none; }
      /* Blur + darken the frozen world behind the panel (brief §4.2), which
         is what makes it read as part of the game rather than pasted on. */
      .go-backdrop {
        position: absolute;
        inset: 0;
        backdrop-filter: blur(8px) saturate(0.85);
        -webkit-backdrop-filter: blur(8px) saturate(0.85);
        background: rgba(12, 10, 8, 0.45);
        opacity: 0;
        transition: opacity 400ms ease;
      }
      #game-over.go-visible .go-backdrop,
      #startup-gate.go-visible .go-backdrop { opacity: 1; }
      .go-panel {
        position: relative;
        width: min(30rem, 86vw);
        padding: 2rem 2.25rem 1.75rem;
        text-align: center;
        color: #f3e6d2;
        /* Aged parchment over dark bark, semi-opaque so the blurred forest
           still shows through faintly. */
        background:
          linear-gradient(rgba(38, 27, 18, 0.9), rgba(24, 18, 12, 0.94)),
          radial-gradient(circle at 30% 20%, #5b3a21, #2b1d12 70%);
        border: 3px solid #6b4423;
        border-radius: 18px 22px 16px 20px; /* irregular, carved-wood feel */
        box-shadow:
          0 0 0 1px rgba(201, 162, 39, 0.25) inset,
          0 18px 50px rgba(0, 0, 0, 0.65);
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 400ms ease, transform 400ms cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      /* Both panels reveal the same way. The reveal rules are ID-scoped, so
         reusing the .go-* classes on the startup gate is not enough on its
         own: .go-panel is opacity:0 by default and stays invisible unless
         its own root is listed here. The gate rendered as a blank screen
         until this was added -- the DOM said "visible", the pixels did not. */
      #game-over.go-visible .go-panel,
      #startup-gate.go-visible .go-panel { opacity: 1; transform: scale(1); }
      .go-title,
      .gate-title {
        margin: 0 0 0.35rem;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #ff8a3d; /* existing NarutoCV accent, not a new colour */
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
      }
      .go-cause,
      .gate-body {
        margin: 0 0 1.35rem;
        font-size: 0.95rem;
        color: #d9c9ae;
      }
      .go-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.6rem;
        margin: 0 0 1.6rem;
        padding: 0.85rem 0.5rem;
        border-top: 1px solid rgba(201, 162, 39, 0.3);
        border-bottom: 1px solid rgba(201, 162, 39, 0.3);
      }
      .go-stats div { display: flex; flex-direction: column; gap: 0.2rem; }
      .go-stats dt {
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.65;
      }
      .go-stats dd {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #f3e6d2;
      }
      .go-button,
      .gate-action {
        pointer-events: auto;
        cursor: pointer;
        width: 100%;
        padding: 0.85rem 1rem;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #24170d;
        background: linear-gradient(#ffa863, #ff8a3d);
        border: 2px solid #c9a227;
        border-radius: 12px;
        box-shadow: 0 6px 0 #a8501c, 0 10px 22px rgba(0, 0, 0, 0.45);
        transition: transform 90ms ease, box-shadow 90ms ease;
      }
      .go-button:hover,
      .gate-action:hover { transform: translateY(-2px); }
      .go-button:active,
      .gate-action:active { transform: translateY(3px); box-shadow: 0 3px 0 #a8501c; }
      .go-button:focus-visible,
      .gate-action:focus-visible { outline: 3px solid #ffe6c2; outline-offset: 3px; }
      .go-hint {
        margin: 0.7rem 0 0;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        opacity: 0.6;
      }
      .go-hint kbd {
        font: inherit;
        padding: 0.05rem 0.3rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      /* Slow drifting leaves, tying the panel to the forest (brief §4.3). */
      .go-leaves {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: inherit;
        pointer-events: none;
      }
      .go-leaves::before,
      .go-leaves::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 7px;
        border-radius: 60% 10% 60% 10%;
        background: #2f7d3a;
        opacity: 0.5;
        animation: leaf-fall 7s linear infinite;
      }
      .go-leaves::after {
        left: 62%;
        background: #c9a227;
        animation-duration: 9s;
        animation-delay: -3s;
      }
      @keyframes leaf-fall {
        0%   { transform: translate(18%, -12%) rotate(0deg); opacity: 0; }
        12%  { opacity: 0.55; }
        100% { transform: translate(42%, 115%) rotate(320deg); opacity: 0; }
      }
      /* =====================================================
         Feature Brief 04 — special attack warning.

         §4.1 requires a "danger palette ... deliberately *not* the existing
         HUD orange", reading as "categorically different from every other UI
         element in the game". So this layer alone uses Obito's crimson
         (#ff1f4b / #8f1236 / #4a0d24, mirrored in specialAttackConfig.ts),
         hard corners instead of the friendly rounded brown of the combat HUD,
         and a screen-edge vignette nothing else in the game has.

         It sits above the combat HUD but below #game-over: dying to the
         special attack must show the Game Over panel, not this.
         ===================================================== */
      #special-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 15;
        color: #fff;
      }
      #special-overlay[hidden] { display: none; }

      /* Full-screen reinforcement (§4.1): the warning has to land even if
         the player is looking at their own hands, not at Naruto.

         Painted as a radial gradient, NOT as a large-blur inset box-shadow.
         The box-shadow version (14vmin/34vmin blur across the whole
         viewport, sitting over the WebGL canvas) cost so much per frame that
         it starved the render loop outright -- the warning window stopped
         counting down and the encounter hung. A gradient rasterises once and
         is cached; only `opacity` animates, which the compositor handles
         without repainting. §6 requires 60fps sustained through this window. */
      .sa-vignette {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity;
        transition: opacity 140ms ease-out;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 31, 75, 0) 42%,
          rgba(143, 18, 54, 0.45) 78%,
          rgba(255, 31, 75, 0.72) 100%
        );
      }
      .sa-vignette.is-armed {
        opacity: 1;
        animation: sa-pulse 0.62s ease-in-out infinite alternate;
      }
      @keyframes sa-pulse {
        from { opacity: 0.55; }
        to   { opacity: 1; }
      }

      /* Anchored to the bottom, laid out as a row.

         It was centred and stacked at first, which put a tall panel exactly
         over Naruto, Obito and the health bars -- the player could not see
         the attack they were being asked to counter, and Obito's wind-up
         (§4.1) was completely hidden. The duel has to stay visible, so this
         sits in the strip the combat seal prompt normally occupies (that
         prompt is hidden for the duration, per §4.2). */
      .sa-card {
        position: absolute;
        left: 50%;
        bottom: 2.2rem;
        transform: translateX(-50%);
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 1.1rem;
        padding: 0.8rem 1.4rem;
        background: rgba(20, 3, 10, 0.86);
        border: 3px solid #ff1f4b;
        box-shadow: 0 0 2.4rem rgba(255, 31, 75, 0.5);
      }
      .sa-card[hidden] { display: none; }
      .sa-copy {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .sa-title {
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        color: #ff1f4b;
      }
      .sa-how {
        font-size: 0.8rem;
        color: #ffd9e2;
        max-width: 22rem;
      }
      /* Countdown ring, draining over the full window (§4.1). Driven by a
         custom property so the JS writes one value, not a repaint. */
      .sa-ring {
        --sa-progress: 0;
        flex: none;
        width: 6.6rem;
        height: 6.6rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(
          #ff1f4b calc(var(--sa-progress) * 360deg),
          #4a0d24 0
        );
      }
      .sa-ring-inner {
        width: 5.5rem;
        height: 5.5rem;
        border-radius: 50%;
        background: rgba(20, 3, 10, 0.95);
        display: grid;
        place-items: center;
        color: #ffd9e2;
      }
      .sa-photo, .sa-hands { width: 4.4rem; height: 4.4rem; }
      .sa-photo { object-fit: contain; border-radius: 50%; }
      .sa-photo[hidden], .sa-schematic[hidden] { display: none; }
      .sa-sign {
        font-size: 1.9rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        line-height: 1.05;
      }
      .sa-key { font-size: 0.85rem; color: #ffc9d4; }
      .sa-key kbd, .sa-practice kbd {
        background: #ff1f4b;
        color: #200;
        border-radius: 3px;
        padding: 0.05rem 0.4rem;
        font-weight: 800;
      }

      /* §2.2's practice prompt — the only thing that teaches the sign
         exists before the moment it can kill the player.

         It started as a small grey-red strip at the top and was missed
         completely in play: the player fought the whole duel without ever
         learning the key existed, so the special attack (which used to wait
         indefinitely for it) never fired and the feature looked unbuilt.
         It is now a pulsing, high-contrast banner. */
      .sa-practice {
        position: absolute;
        left: 50%;
        top: 1.2rem;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.7rem;
        background: rgba(20, 3, 10, 0.92);
        border: 3px solid #ff1f4b;
        box-shadow: 0 0 1.6rem rgba(255, 31, 75, 0.55);
        padding: 0.6rem 1.1rem;
        font-size: 1rem;
        letter-spacing: 0.02em;
        animation: sa-practice-pulse 1.1s ease-in-out infinite alternate;
      }
      .sa-practice[hidden] { display: none; }
      .sa-practice-mark {
        display: grid;
        place-items: center;
        width: 1.7rem;
        height: 1.7rem;
        flex: none;
        border-radius: 50%;
        background: #ff1f4b;
        color: #200;
        font-weight: 900;
      }
      @keyframes sa-practice-pulse {
        from { box-shadow: 0 0 0.6rem rgba(255, 31, 75, 0.35); }
        to   { box-shadow: 0 0 2rem rgba(255, 31, 75, 0.85); }
      }

      .sa-result {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        font-size: 2.6rem;
        font-weight: 900;
        letter-spacing: 0.14em;
      }
      .sa-result[hidden] { display: none; }
      .sa-result[data-outcome="countered"] { color: #7ef0c0; text-shadow: 0 0 1.6rem rgba(126, 240, 192, 0.8); }
      .sa-result[data-outcome="struck"] { color: #ff1f4b; text-shadow: 0 0 1.6rem rgba(255, 31, 75, 0.9); }
      .sa-result-in { animation: sa-result-pop 420ms ease-out; }
      @keyframes sa-result-pop {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }

      /* =====================================================
         Feature Brief 05 — camera preview and startup gate.

         §0.1: the only free region is the BOTTOM-RIGHT. Top-left, top-centre,
         top-right (seal prompts), above-characters and bottom-left are all
         spoken for, and nothing existing may move to make room for this.

         The gate panels reuse the Game Over panel's own classes (.go-panel,
         .go-backdrop, .go-button, .go-leaves) rather than restyling anything,
         per §4's "do not introduce a new visual style".
         ===================================================== */
      #camera-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 12;
      }
      #camera-hud[hidden] { display: none; }

      /* §7.2 — persistent tracking indicator. Sits directly above the
         preview in the same free corner, so it displaces nothing. */
      .cam-indicator {
        position: absolute;
        right: 1.25rem;
        bottom: 11.6rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(24, 18, 12, 0.8);
        border: 1px solid #6b4423;
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f4f4f5;
      }
      .cam-indicator[hidden] { display: none; }
      .cam-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #6b4423;
      }

      /* §7.1 — ~180x135, rounded, framed in the existing style. */
      .cam-preview {
        --cam-ring: #6b4423;
        position: absolute;
        right: 1.25rem;
        bottom: 3.6rem;
        width: 180px;
        height: 135px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid var(--cam-ring);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.5);
        background: #120f0c;
        pointer-events: auto;
        transition: border-color 200ms ease;
      }
      .cam-preview[hidden] { display: none; }
      /* The mirror. The pose adapter mirrors the landmarks to match this --
         see poseAdapter.ts. Do not add a flip anywhere else. */
      .cam-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      .cam-skeleton {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .cam-toggle {
        position: absolute;
        top: 0.2rem;
        right: 0.3rem;
        width: 1.2rem;
        height: 1.2rem;
        line-height: 1;
        border-radius: 4px;
        border: 1px solid #6b4423;
        background: rgba(24, 18, 12, 0.85);
        color: #f4f4f5;
        font-size: 0.85rem;
        cursor: pointer;
      }

      /* --- startup gate --- */
      #startup-gate {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 18;
      }
      #startup-gate[hidden] { display: none; }
      .gate-panel { max-width: 30rem; }
      .gate-progress {
        width: 100%;
        height: 6px;
        margin: 0.2rem 0 0.9rem;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .gate-progress[hidden] { display: none; }
      .gate-progress > span {
        display: block;
        height: 100%;
        background: #8fbf4d;
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 120ms linear;
      }
      .gate-keyboard {
        margin-top: 0.6rem;
        background: none;
        border: 1px solid #6b4423;
        border-radius: 8px;
        color: #ffd9a0;
        padding: 0.35rem 0.9rem;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .gate-keyboard[hidden] { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .go-panel, .go-backdrop { transition: none; }
        .gate-progress > span { transition: none; }
        .go-leaves::before, .go-leaves::after { animation: none; opacity: 0; }
        .combat-banner-in { animation-duration: 0.01ms; }
        /* The vignette still shows at full strength -- it is a safety
           warning, not decoration -- it just stops flashing. */
        .sa-vignette.is-armed { animation: none; opacity: 1; }
        .sa-result-in { animation-duration: 0.01ms; }
        .sa-practice { animation: none; }
      }
    </style>
  </head>
