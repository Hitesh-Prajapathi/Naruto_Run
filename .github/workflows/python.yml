name: python

# Python version comes from .python-version (uv reads it automatically).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tools/collect/server/**"
      - "schemas/**"
      - "models/manifest.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tools/collect/server/**"
      - "schemas/**"
      - "models/manifest.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: System libs for OpenCV/MediaPipe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: uv sync --frozen --extra runtime --extra transport --extra eval --extra collect --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Collect receiver self-test
        run: uv run python tools/collect/server/receive.py --self-test

  mypy:
    name: mypy (non-blocking, known failures)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: System libs for OpenCV/MediaPipe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: uv sync --frozen --extra runtime --extra transport --extra eval --extra collect --extra dev
      - run: uv run mypy src/narutocv
